name: EZ Android validation
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Validation, signed candidate, or FIRST-TIME production key setup'
        type: choice
        default: validate
        options:
          - validate
          - sign
          - prepare-first-key
      confirmation:
        description: 'For FIRST-TIME setup only, type CREATE-FIRST-KEY'
        type: string
        default: ''
      signing_backup_run_id:
        description: 'First candidate only: successful first-key backup run ID (leave blank with keystore Secret)'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || inputs.operation == 'validate'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Preserve development signing identity for subsequent debug builds
        uses: actions/cache@v4
        with:
          path: ~/.android/ez-development-debug.jks
          key: ez-development-debug-key-v2
      - name: Prepare explicit development signing key
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/ez-development-debug.jks" ]; then
            keytool -genkeypair -keystore "$HOME/.android/ez-development-debug.jks" -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=EZ Android Debug,O=Development,C=US'
          fi
          echo "EZ_DEBUG_KEYSTORE_PATH=$HOME/.android/ez-development-debug.jks" >> "$GITHUB_ENV"
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test, render native UI, lint and assemble release candidate
        run: |
          chmod +x gradlew
          python3 scripts/test_release_gate.py
          python3 scripts/test_signing_setup.py
          ./gradlew --no-daemon :core:test :app:testDebugUnitTest :app:lintDebug :app:lintRelease :app:assembleRelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EZ-test-and-lint-reports
          path: |
            core/build/reports/tests/
            app/build/reports/tests/
            app/build/reports/lint-results-*
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EZ-native-design-captures
          path: app/build/outputs/roborazzi/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: EZ-1.0.0-release-unsigned-NOT-INSTALLABLE
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14
  signed-candidate:
    permissions:
      contents: read
      actions: read
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'sign'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Select persistent secret or explicitly requested owner backup
        id: signing-source
        env:
          STORE_B64: ${{ secrets.EZ_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.EZ_RELEASE_STORE_PASSWORD }}
          BACKUP_RUN: ${{ inputs.signing_backup_run_id }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          test -n "$STORE_PASSWORD" || { echo 'Production store password is missing.'; exit 1; }
          if [ -n "$STORE_B64" ]; then
            echo 'use_backup=false' >> "$GITHUB_OUTPUT"
          else
            [[ "$BACKUP_RUN" =~ ^[0-9]+$ ]] || { echo 'Configure the persistent keystore Secret or supply the successful first-key backup run ID.'; exit 1; }
            gh api "repos/$REPOSITORY/actions/runs/$BACKUP_RUN" > key-import-run.json
            python3 - <<'PY'
          import json
          r=json.load(open('key-import-run.json'))
          assert r['conclusion']=='success' and r['event']=='workflow_dispatch'
          assert r['path']=='.github/workflows/android.yml' and r['run_attempt']==1
          PY
            echo 'use_backup=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Download the already-created encrypted owner backup
        if: steps.signing-source.outputs.use_backup == 'true'
        uses: actions/download-artifact@v4
        with:
          name: EZ-FIRST-KEY-ENCRYPTED-BACKUP-${{ inputs.signing_backup_run_id }}
          run-id: ${{ inputs.signing_backup_run_id }}
          path: ${{ runner.temp }}/ez-first-key-import
          github-token: ${{ github.token }}
      - name: Verify backup provenance and pinned certificate before import
        if: steps.signing-source.outputs.use_backup == 'true'
        env:
          EZ_RELEASE_CERT_SHA256: ${{ vars.EZ_RELEASE_CERT_SHA256 }}
        run: python3 scripts/load_signing_backup.py "$RUNNER_TEMP/ez-first-key-import" key-import-run.json "$RUNNER_TEMP/ez-production.jks"
      - name: Load persistent production key without logging its contents
        if: steps.signing-source.outputs.use_backup != 'true'
        env:
          STORE_B64: ${{ secrets.EZ_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.EZ_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.EZ_RELEASE_KEY_ALIAS || 'ez-release' }}
          KEY_PASSWORD: ${{ secrets.EZ_RELEASE_KEY_PASSWORD || secrets.EZ_RELEASE_STORE_PASSWORD }}
        run: |
          test -n "$STORE_B64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || { echo 'Production signing credentials are missing; refusing debug or ephemeral fallback.'; exit 1; }
          python3 - <<'PY'
          import base64,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'ez-production.jks'
          p.write_bytes(base64.b64decode(os.environ['STORE_B64'],validate=True));p.chmod(0o600)
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('EZ_RELEASE_STORE_FILE='+str(p)+'\n')
          PY
      - name: Test, capture, lint, and assemble signed non-debug candidate
        env:
          EZ_RELEASE_STORE_PASSWORD: ${{ secrets.EZ_RELEASE_STORE_PASSWORD }}
          EZ_RELEASE_KEY_ALIAS: ${{ secrets.EZ_RELEASE_KEY_ALIAS || 'ez-release' }}
          EZ_RELEASE_KEY_PASSWORD: ${{ secrets.EZ_RELEASE_KEY_PASSWORD || secrets.EZ_RELEASE_STORE_PASSWORD }}
        run: |
          chmod +x gradlew
          python3 scripts/test_release_gate.py
          python3 scripts/test_signing_setup.py
          ./gradlew --no-daemon :core:test :app:testDebugUnitTest :app:lintDebug :app:lintRelease :app:assembleRelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EZ-signed-candidate-test-and-lint-reports
          path: |
            core/build/reports/tests/
            app/build/reports/tests/
            app/build/reports/lint-results-*
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EZ-signed-candidate-native-captures
          path: app/build/outputs/roborazzi/
          if-no-files-found: warn
      - name: Verify installable signed APK and production certificate
        env:
          EZ_RELEASE_CERT_SHA256: ${{ vars.EZ_RELEASE_CERT_SHA256 }}
        run: |
          mkdir candidate
          cp app/build/outputs/apk/release/app-release.apk candidate/EZ-1.0.0.apk
          python3 scripts/inspect_release.py candidate/EZ-1.0.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: EZ-1.0.0-signed-candidate
          path: candidate/
          retention-days: 30
          if-no-files-found: error
      - name: Remove runner-local private key
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/ez-production.jks"
          rm -rf "$RUNNER_TEMP/ez-first-key-import"
  prepare-first-key:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'prepare-first-key'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Require intentional first-time creation, never an automatic replacement
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          test "$CONFIRMATION" = 'CREATE-FIRST-KEY' && test "$RUN_ATTEMPT" = '1' || { echo 'First-time creation requires explicit confirmation; workflow reruns are refused.'; exit 1; }
      - name: Generate password-encrypted persistent production identity
        env:
          EZ_RELEASE_STORE_PASSWORD: ${{ secrets.EZ_RELEASE_STORE_PASSWORD }}
          EXISTING_RELEASE_KEY: ${{ secrets.EZ_RELEASE_KEYSTORE_BASE64 }}
        run: python3 scripts/prepare_signing_key.py "$RUNNER_TEMP/ez-owner-backup"
      - uses: actions/upload-artifact@v4
        with:
          name: EZ-FIRST-KEY-ENCRYPTED-BACKUP-${{ github.run_id }}
          path: ${{ runner.temp }}/ez-owner-backup/
          retention-days: 7
          if-no-files-found: error
      - name: Record public certificate and backup instructions only
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          identity=json.loads((Path(os.environ['RUNNER_TEMP'])/'ez-owner-backup/PUBLIC-IDENTITY.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## First-time EZ production identity\nEncrypted backup artifact expires in 7 days. Save TWO private offline copies now.\n\n')
              f.write('Public certificate SHA-256: `'+identity['certificate_sha256']+'`\n\n')
              f.write('Keep two private encrypted backups. Configure EZ_RELEASE_KEYSTORE_BASE64 for permanent CI storage. Alias defaults to ez-release and entry password defaults to the saved store password. Set variable EZ_RELEASE_CERT_SHA256 to the public fingerprint. Never paste private material in chat.\n')
          PY
      - name: Remove runner-local signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/ez-owner-backup"
