name: EZ Android Alpha
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Materialize initial source archive if needed
        run: |
          if [ ! -f app/build.gradle.kts ]; then
            unzip -oq EZ-Alpha-Source.zip -d .
          fi
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test, lint and build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :core:test :app:lintDebug :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EZ-test-and-lint-reports
          path: |
            core/build/reports/tests/
            app/build/reports/lint-results-debug.*
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: EZ-Alpha-0.1-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
  materialize-reviewed-source:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/alpha/')
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Expand tested source on development branch once
        run: |
          if [ -f app/build.gradle.kts ]; then exit 0; fi
          unzip -oq EZ-Alpha-Source.zip -d .
          chmod +x gradlew
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app core gradle gradlew settings.gradle.kts build.gradle.kts gradle.properties .gitignore README.md TESTING.md SECURITY.md
          git commit -m 'Materialize CI-tested Alpha source from bootstrap archive'
          git push origin HEAD:${GITHUB_REF_NAME}
