name: EZ Android validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Preserve development signing identity for subsequent debug builds
        uses: actions/cache@v4
        with:
          path: ~/.android/ez-development-debug.jks
          key: ez-development-debug-key-v2
      - name: Prepare explicit development signing key
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/ez-development-debug.jks" ]; then
            keytool -genkeypair -keystore "$HOME/.android/ez-development-debug.jks" -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=EZ Android Debug,O=Development,C=US'
          fi
          echo "EZ_DEBUG_KEYSTORE_PATH=$HOME/.android/ez-development-debug.jks" >> "$GITHUB_ENV"
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test, render native UI, lint and assemble release candidate
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :core:test :app:testDebugUnitTest :app:lintDebug :app:lintRelease :app:assembleRelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EZ-test-and-lint-reports
          path: |
            core/build/reports/tests/
            app/build/reports/tests/
            app/build/reports/lint-results-*
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EZ-native-design-captures
          path: app/build/outputs/roborazzi/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: EZ-1.0.0-release-unsigned-NOT-INSTALLABLE
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14
