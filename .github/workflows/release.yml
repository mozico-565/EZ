name: EZ signed release gates
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [candidate, publish]
        default: candidate
        required: true
        description: Build signed candidate, or publish the exact physically tested candidate
      candidate_run_id:
        type: string
        default: ''
        description: Successful candidate run ID (publish only)
permissions:
  contents: read
concurrency:
  group: ez-production-release
  cancel-in-progress: false
jobs:
  candidate:
    if: inputs.mode == 'candidate'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Load persistent production key without logging its contents
        env:
          STORE_B64: ${{ secrets.EZ_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.EZ_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.EZ_RELEASE_KEY_ALIAS || 'ez-release' }}
          KEY_PASSWORD: ${{ secrets.EZ_RELEASE_KEY_PASSWORD || secrets.EZ_RELEASE_STORE_PASSWORD }}
        run: |
          test -n "$STORE_B64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || { echo 'Production signing credentials are missing; refusing debug or ephemeral fallback.'; exit 1; }
          python3 - <<'PY'
          import base64,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'ez-production.jks'
          p.write_bytes(base64.b64decode(os.environ['STORE_B64'],validate=True));p.chmod(0o600)
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('EZ_RELEASE_STORE_FILE='+str(p)+'\n')
          PY
      - name: Test, capture, lint, and assemble signed non-debug candidate
        env:
          EZ_RELEASE_STORE_PASSWORD: ${{ secrets.EZ_RELEASE_STORE_PASSWORD }}
          EZ_RELEASE_KEY_ALIAS: ${{ secrets.EZ_RELEASE_KEY_ALIAS || 'ez-release' }}
          EZ_RELEASE_KEY_PASSWORD: ${{ secrets.EZ_RELEASE_KEY_PASSWORD || secrets.EZ_RELEASE_STORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :core:test :app:testDebugUnitTest :app:lintDebug :app:lintRelease :app:assembleRelease
      - name: Verify installable signed APK and production certificate
        env:
          EZ_RELEASE_CERT_SHA256: ${{ vars.EZ_RELEASE_CERT_SHA256 }}
        run: |
          mkdir candidate
          cp app/build/outputs/apk/release/app-release.apk candidate/EZ-1.0.0.apk
          python3 scripts/inspect_release.py candidate/EZ-1.0.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: EZ-1.0.0-signed-candidate
          path: candidate/
          retention-days: 30
          if-no-files-found: error
      - name: Remove runner-local private key
        if: always()
        run: rm -f "$RUNNER_TEMP/ez-production.jks"
  publish:
    if: inputs.mode == 'publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      EZ_RELEASE_CERT_SHA256: ${{ vars.EZ_RELEASE_CERT_SHA256 }}
      EZ_RELEASE_APPROVED_SHA: ${{ vars.EZ_RELEASE_APPROVED_SHA }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate candidate provenance and successful workflow
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          [[ "$CANDIDATE_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" > candidate-run.json
          python3 - <<'PY'
          import json
          r=json.load(open('candidate-run.json'))
          assert r['conclusion']=='success' and r['event']=='workflow_dispatch' and r['path'] in ('.github/workflows/release.yml','.github/workflows/android.yml')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: EZ-1.0.0-signed-candidate
          path: candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Gate exact signed binary against two-phone acceptance
        run: |
          python3 - <<'PY'
          import json
          assert json.load(open('candidate-run.json'))['head_sha']==json.load(open('candidate/build-metadata.json'))['source_commit']
          PY
          python3 scripts/verify_release_gate.py release/PHYSICAL-ACCEPTANCE.json candidate/build-metadata.json candidate/EZ-1.0.0.apk
      - name: Create immutable version tag and publish verified assets
        run: |
          test -z "$(git ls-remote --tags origin refs/tags/v1.0.0)" || { echo 'v1.0.0 already exists; refusing overwrite.'; exit 1; }
          source_commit=$(python3 -c "import json;print(json.load(open('candidate/build-metadata.json'))['source_commit'])")
          git tag v1.0.0 "$source_commit"
          git push origin refs/tags/v1.0.0
          gh release create v1.0.0 candidate/EZ-1.0.0.apk candidate/SHA256SUMS.txt candidate/build-metadata.json --verify-tag --title 'EZ 1.0.0' --notes-file release/RELEASE-NOTES.md
          gh release view v1.0.0 --json url,tagName,isDraft,isPrerelease
