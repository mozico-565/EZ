name: EZ two-peer regression and signed APK
'on':
  push:
    branches:
    - fix/repeated-peer-sessions
permissions:
  contents: read
concurrency:
  group: ez-two-peer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dual-peer:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'
        cache: gradle
    - uses: android-actions/setup-android@v3
      with:
        packages: platform-tools emulator
    - name: Enable KVM
      run: 'echo ''KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'' | sudo tee /etc/udev/rules.d/99-kvm4all.rules

        sudo udevadm control --reload-rules

        sudo udevadm trigger --name-match=kvm

        sudo apt-get update -qq

        sudo apt-get install -y tcpdump'
    - name: Inspect and pin official APK
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'mkdir official

        gh release download v1.0.0 --repo "$GITHUB_REPOSITORY" --pattern ''EZ-1.0.0.apk'' --dir official

        echo ''54ed700f3835bbacfdd4ee0082e3216fc0c9345708f19b89639c4c9d9c5babbb  official/EZ-1.0.0.apk'' | sha256sum -c -

        sdkmanager ''platforms;android-35'' ''build-tools;35.0.0''

        "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs official/EZ-1.0.0.apk'
    - name: Build baseline from exact official source with test-only harness
      run: 'git worktree add baseline 8b183d07b9c660eedbb767399655f9397493207c

        cp app/src/androidTest/java/com/ezshare/app/NetworkPeerHarnessTest.kt baseline/app/src/androidTest/java/com/ezshare/app/

        chmod +x baseline/gradlew

        cd baseline

        ./gradlew --no-daemon --max-workers=2 :app:assembleDebug :app:assembleDebugAndroidTest'
    - name: Test and build patched app and instrumentation
      run: 'chmod +x gradlew

        ./gradlew --no-daemon --max-workers=2 :core:test :app:testDebugUnitTest :app:lintDebug :app:lintRelease :app:assembleDebug :app:assembleDebugAndroidTest'
    - name: Two independent Android emulators baseline and patched TCP sessions
      run: bash scripts/run_dual_emulators.sh
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: EZ-two-emulator-network-evidence
        path: 'network-evidence/

          core/build/reports/tests/

          app/build/reports/tests/

          app/build/reports/lint-results-*'
        if-no-files-found: warn
        retention-days: 30
  signed-network-fix:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - uses: gradle/actions/wrapper-validation@v4
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'
        cache: gradle
    - uses: android-actions/setup-android@v3
      with:
        packages: platform-tools
    - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      name: Select persistent production identity
    - name: Select persistent secret or explicitly requested owner backup
      id: signing-source
      env:
        STORE_B64: ${{ secrets.EZ_RELEASE_KEYSTORE_BASE64 }}
        STORE_PASSWORD: ${{ secrets.EZ_RELEASE_STORE_PASSWORD }}
        BACKUP_RUN: '39137952284'
        GH_TOKEN: ${{ github.token }}
        REPOSITORY: ${{ github.repository }}
      run: "test -n \"$STORE_PASSWORD\" || { echo 'Production store password is missing.'; exit 1; }\nif [ -n \"$STORE_B64\" ]; then\n  echo 'use_backup=false'\
        \ >> \"$GITHUB_OUTPUT\"\nelse\n  [[ \"$BACKUP_RUN\" =~ ^[0-9]+$ ]] || { echo 'Configure the persistent keystore Secret or supply the successful\
        \ first-key backup run ID.'; exit 1; }\n  gh api \"repos/$REPOSITORY/actions/runs/$BACKUP_RUN\" > key-import-run.json\n  python3 - <<'PY'\n\
        import json\nr=json.load(open('key-import-run.json'))\nassert r['conclusion']=='success' and r['event']=='workflow_dispatch'\nassert r['path']=='.github/workflows/android.yml'\
        \ and r['run_attempt']==1\nPY\n  echo 'use_backup=true' >> \"$GITHUB_OUTPUT\"\nfi\n"
    - name: Download the already-created encrypted owner backup
      if: steps.signing-source.outputs.use_backup == 'true'
      uses: actions/download-artifact@v4
      with:
        name: EZ-FIRST-KEY-ENCRYPTED-BACKUP-39137952284
        run-id: 39137952284
        path: ${{ runner.temp }}/ez-first-key-import
        github-token: ${{ github.token }}
    - name: Verify backup provenance and pinned certificate before import
      if: steps.signing-source.outputs.use_backup == 'true'
      env:
        EZ_RELEASE_CERT_SHA256: ${{ vars.EZ_RELEASE_CERT_SHA256 }}
      run: python3 scripts/load_signing_backup.py "$RUNNER_TEMP/ez-first-key-import" key-import-run.json "$RUNNER_TEMP/ez-production.jks"
    - name: Load persistent production key without logging its contents
      if: steps.signing-source.outputs.use_backup != 'true'
      env:
        STORE_B64: ${{ secrets.EZ_RELEASE_KEYSTORE_BASE64 }}
        STORE_PASSWORD: ${{ secrets.EZ_RELEASE_STORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.EZ_RELEASE_KEY_ALIAS || 'ez-release' }}
        KEY_PASSWORD: ${{ secrets.EZ_RELEASE_KEY_PASSWORD || secrets.EZ_RELEASE_STORE_PASSWORD }}
      run: 'test -n "$STORE_B64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || { echo ''Production signing
        credentials are missing; refusing debug or ephemeral fallback.''; exit 1; }

        python3 - <<''PY''

        import base64,os

        from pathlib import Path

        p=Path(os.environ[''RUNNER_TEMP''])/''ez-production.jks''

        p.write_bytes(base64.b64decode(os.environ[''STORE_B64''],validate=True));p.chmod(0o600)

        with open(os.environ[''GITHUB_ENV''],''a'') as f:f.write(''EZ_RELEASE_STORE_FILE=''+str(p)+''\n'')

        PY

        '
    - name: Test, capture, lint, and assemble signed non-debug candidate
      env:
        EZ_RELEASE_STORE_PASSWORD: ${{ secrets.EZ_RELEASE_STORE_PASSWORD }}
        EZ_RELEASE_KEY_ALIAS: ${{ secrets.EZ_RELEASE_KEY_ALIAS || 'ez-release' }}
        EZ_RELEASE_KEY_PASSWORD: ${{ secrets.EZ_RELEASE_KEY_PASSWORD || secrets.EZ_RELEASE_STORE_PASSWORD }}
      run: 'chmod +x gradlew

        python3 scripts/test_release_gate.py

        python3 scripts/test_signing_setup.py

        ./gradlew --no-daemon :core:test :app:testDebugUnitTest :app:lintDebug :app:lintRelease :app:assembleRelease

        '
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: EZ-signed-candidate-test-and-lint-reports
        path: 'core/build/reports/tests/

          app/build/reports/tests/

          app/build/reports/lint-results-*

          '
        if-no-files-found: warn
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: EZ-signed-candidate-native-captures
        path: app/build/outputs/roborazzi/
        if-no-files-found: warn
    - name: Verify installable signed APK and production certificate
      env:
        EZ_RELEASE_CERT_SHA256: ${{ vars.EZ_RELEASE_CERT_SHA256 }}
      run: 'mkdir candidate

        cp app/build/outputs/apk/release/app-release.apk candidate/EZ-1.0.0.apk

        python3 scripts/inspect_release.py candidate/EZ-1.0.0.apk

        '
    - uses: actions/upload-artifact@v4
      with:
        name: EZ-1.0.0-network-fix-signed-code12
        path: candidate/
        retention-days: 30
        if-no-files-found: error
    - name: Remove runner-local private key
      if: always()
      run: 'rm -f "$RUNNER_TEMP/ez-production.jks"

        rm -rf "$RUNNER_TEMP/ez-first-key-import"

        '
    needs: dual-peer
